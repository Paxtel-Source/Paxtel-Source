name: Cobrinha de contribuições

# Gera a animação da cobrinha uma vez por dia, a cada push na main
# e também quando você clicar em "Run workflow" na aba Actions.
on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 00:00 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar os SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00A86B&color_dots=#11251D,#0B3D2E,#00694A,#00A86B,#3DDC97
            dist/snake-light.svg?color_snake=#00694A&color_dots=#EBEDF0,#B7EBD2,#5FD3A0,#00A86B,#00694A

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
